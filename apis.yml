aid: ourcrowd
name: OurCrowd
description: 'OurCrowd is a global private-market investment platform that gives accredited and institutional
  investors access to curated venture and alternative-asset deals. Through a single online account, members
  can invest in pre-vetted startups, thematic and targeted venture funds, and a range of alternatives such
  as private equity and private credit. The platform handles deal sourcing, due diligence, syndication, and
  post-investment management. OurCrowd is a consumer-facing investment product and does not publish a public
  developer API, SDKs, or developer documentation; this profile captures its public identity and web surface.'
